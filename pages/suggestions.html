  <body>
   <header>
      <a href="index.html">
        <h1>M4FIA</h1>
      </a>
      <nav>
        <ul>
          <li><a href="wiki.html">Wiki</a></li>
          <li><a href="game-tracker.html">Game Tracker</a></li>
          <li><a href="suggestions.html">Suggestions</a></li>

    <main>
      <section id="landing">
        <div class="comp">
          <img id="compimg" src="../images/compu-temporary.png">
          <div class="form">
            <p class="cmd">Initializing interactive feedback wizard...</p>

            <div id="sug-name" class="show">
              <label for="name">C:\M4FIA\Suggestions\Name></label>
             <input type="text" id="name" autofocus></input> <br>
            </div> 

            <div id="sug-cat" class="hide">
             <label for="category">C:\M4FIA\Suggestions\Type> [1: Feature, 2: Bug, 3: Other]:</label>
             <input type="text" id="category"/> <br>
            </div>

            <div id="sug-text" class="hide">
              <label for="suggestion">C:\M4FIA\Suggestions\Suggestion> </label>
              <input type="text" id="suggestion"/> <br>
            </div>

             <div id="sug-conf" class="hide">
              <label for="conf">C:\M4FIA\Suggestions\Confirmation> Do you confirm your suggestion? [y/n]:</label>
              <input type="text" id="conf"/> <br>
            </div>

            <p id="err"></p>
          </div>
        </div> 
      </section>
     </main>
