    <link rel="stylesheet" href="../css/GTP.css">
    <script src="../js/GTP.js" defer></script>
  </head>

  <body>
    <header>
      <div id="MOB-NAV">
          <a id="HOME" href="../index.html">
            <img src="../images/M4fiaLogo.png" alt="M4FIA Logo">
          </a>
          <input type="checkbox" id="HAMBURGER"/>
          <label for="HAMBURGER"></label>
      </div>
      <nav>
        <ul id="MENU">
          <li class="item"><a href="wiki.html">Wiki</a></li>
          <li class="item"><a href="game-tracker.html">Game Tracker</a></li>
          <li class="item"><a href="suggestions.html">Suggestions</a></li>
          <li class="item"><a href="legal.html">Legal</a></li>
        </ul>
      </nav>
    </header>

    <main>
      
      <div class="title-div">
          <p class="GTspan1">GAME TRACKER</p>
          <p class="GTspan2">Keep Note of your Current Game</p>
      </div>
      
      <section id="PlayerInput">
        <div id="PlayerInputBox">
          <p><span class="PlayInputText">How many players are there?</span></p>

          <div id="PlayNumControl">
            <button id="PlayMinus">-</button>
            <input type="number" id="PlayNumInput" min="4" max="20" value="6">
            <button id="PlayPlus">+</button>
          </div>

          <button id="PlayNumConfirm">Confirm</button>
        </div>
      </section>

      <section id="GameInfo">
        <div id="MePlayerCard">
          <input id="MePlayerName" value="Me">
          <button id="MePlayerStatus">ALIVE</button>

          <div id="MeRoleSelection">
            <img id="MeRoleIcon" src="../images/RoleIcons/Unknown.png">
            <select id="MePlayerRole"></select>
          </div>
        </div>

        <div id="TimeTracker">
          <div id="GameTimeTitle">
            <p>CURRENT PHASE</p>
          </div>

          <div id="GameTime" class="day-icon">
            <p id="GameTimeP">DAY 1</p>
          </div>

          <div id="TimeControl">
            <button id="TimePrev"><span>Prev</span></button>
            <button id="TimeNext"><span>Next</span></button>
          </div>
        </div>
      </section>

      <section id="PlayerList">
      </section>
    </main>
  </body>
